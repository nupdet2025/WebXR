<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer with AR</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 80%;
      background-color: #f0f0f0;
    }
    #error-message {
      display: none;
      color: red;
      text-align: center;
      margin-top: 10px;
      font-size: 16px;
    }
    #ar-button {
      display: none;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    #ar-button:hover {
      background-color: #135ab6;
    }
  </style>
</head>
<body>
  <model-viewer
    id="model-viewer"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="A 3D model of an astronaut"
    ar
    ar-modes="webxr scene-viewer quick-look"
    auto-rotate
    camera-controls
    camera-orbit="45deg 55deg 2.5m"
  ></model-viewer>
  <button id="ar-button">View in AR</button>
  <div id="error-message"></div>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script>
    const modelViewer = document.querySelector('model-viewer');
    const arButton = document.getElementById('ar-button');
    const errorMessage = document.getElementById('error-message');

    // Check WebXR support
    async function checkARSupport() {
      if (navigator.xr) {
        try {
          const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
          if (isSupported) {
            arButton.style.display = 'block';
            arButton.addEventListener('click', () => {
              modelViewer.activateAR();
            });
          } else {
            showError('AR is not supported on this device or browser. Ensure you are using Chrome (Android) or Safari (iOS) with ARCore/ARKit support.');
          }
        } catch (error) {
          showError('Error checking AR support: ' + error.message);
        }
      } else {
        showError('WebXR is not supported by this browser. Try using Chrome on Android or Safari on iOS.');
      }
    }

    // Display error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      arButton.style.display = 'none';
    }

    // Handle permission errors
    modelViewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'failed') {
        showError('Failed to start AR. Please grant camera permissions and try again.');
      }
    });

    // Initialize AR check
    checkARSupport();
  </script>
</body>
</html>
